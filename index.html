<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie note</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5f4a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#d9d6cc;--btn:#1f5f4a;--btnink:#fff;--del:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#21211f;--ink:#f0eee8;--mute:#a09e96;--line:#3a3935;--btn:#5cc2a0;--btnink:#0d1f19;--del:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;font-weight:600;margin:8px 0 16px}
button,input,textarea{font:inherit;font-size:18px}
button{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.primario{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:600}
.elimina{color:var(--del)}
input,textarea{width:100%;padding:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;display:block}
input{margin-bottom:12px;font-weight:600}
textarea{min-height:50vh;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--btn);outline-offset:1px}
.riga{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px;min-height:60px}
.riga b{display:block}
.riga span{color:var(--mute);font-size:15px}
.barra{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.vuoto{color:var(--mute);margin-top:20px}
.nascosta{display:none}
</style>
</head>
<body>
<main>

<!-- SCHERMATA 1: la lista delle note -->
<div id="schermataLista">
  <h1>Le mie note</h1>
  <button class="primario" onclick="nuova()">+ Nuova nota</button>
  <div id="elenco"></div>
</div>

<!-- SCHERMATA 2: la pagina bianca per scrivere -->
<div id="schermataNota" class="nascosta">
  <input id="titolo" placeholder="Titolo">
  <textarea id="testo" placeholder="Scrivi qui la tua nota..."></textarea>
  <div class="barra">
    <button class="primario" onclick="salva()">Salva</button>
    <button onclick="mostraLista()">Indietro</button>
    <button id="tastoElimina" class="elimina" onclick="elimina()">Elimina</button>
  </div>
</div>

</main>
<script>
// ---- I DATI ----
// "note" è una lista di oggetti: ogni nota ha un titolo e un testo
let note = []
// "corrente" è la posizione della nota aperta (-1 = nota nuova, non ancora salvata)
let corrente = -1

// Carica le note salvate nel dispositivo (se ci sono)
try { note = JSON.parse(localStorage.getItem("note")) || [] } catch (e) {}

// Salva la lista nel dispositivo
function salvaNelDispositivo() {
  try { localStorage.setItem("note", JSON.stringify(note)) } catch (e) {}
}

// ---- MOSTRARE LE SCHERMATE ----
function mostraLista() {
  document.getElementById("schermataNota").classList.add("nascosta")
  document.getElementById("schermataLista").classList.remove("nascosta")

  let elenco = document.getElementById("elenco")
  elenco.innerHTML = ""

  if (note.length === 0) {
    let vuoto = document.createElement("p")
    vuoto.className = "vuoto"
    vuoto.textContent = "Nessuna nota. Premi + Nuova nota per iniziare."
    elenco.appendChild(vuoto)
  }

  // Il solito ciclo for: un pulsante per ogni nota
  for (let i = 0; i < note.length; i++) {
    let riga = document.createElement("button")
    riga.className = "riga"
    let t = document.createElement("b")
    t.textContent = note[i].titolo
    let anteprima = document.createElement("span")
    anteprima.textContent = note[i].testo.slice(0, 60)
    riga.appendChild(t)
    riga.appendChild(anteprima)
    riga.onclick = function () { apri(i) }
    elenco.appendChild(riga)
  }
}

function mostraNota() {
  document.getElementById("schermataLista").classList.add("nascosta")
  document.getElementById("schermataNota").classList.remove("nascosta")
}

// ---- LE AZIONI ----
// Apre una pagina bianca per una nota nuova
function nuova() {
  corrente = -1
  document.getElementById("titolo").value = ""
  document.getElementById("testo").value = ""
  document.getElementById("tastoElimina").classList.add("nascosta")
  mostraNota()
  document.getElementById("titolo").focus()
}

// Apre una nota esistente per modificarla
function apri(i) {
  corrente = i
  document.getElementById("titolo").value = note[i].titolo
  document.getElementById("testo").value = note[i].testo
  document.getElementById("tastoElimina").classList.remove("nascosta")
  mostraNota()
}

// Salva la nota (nuova o modificata)
function salva() {
  let titolo = document.getElementById("titolo").value.trim()
  let testo = document.getElementById("testo").value

  // Se è tutto vuoto, non salvare niente
  if (titolo === "" && testo.trim() === "") {
    mostraLista()
    return
  }
  if (titolo === "") { titolo = "Senza titolo" }

  let nota = { titolo: titolo, testo: testo }
  if (corrente === -1) {
    note.push(nota)          // nota nuova: in fondo alla lista
  } else {
    note[corrente] = nota    // nota esistente: sostituisce quella vecchia
  }
  salvaNelDispositivo()
  mostraLista()
}

// Elimina la nota aperta (chiede conferma)
function elimina() {
  if (corrente === -1) { return }
  if (!confirm("Eliminare questa nota?")) { return }
  note.splice(corrente, 1)   // toglie 1 elemento dalla posizione "corrente"
  salvaNelDispositivo()
  mostraLista()
}

// All'apertura della pagina, mostra la lista
mostraLista()

// ---- APP INSTALLABILE ----
// Registra il "service worker": il file sw.js che fa funzionare l'app anche senza internet
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {})
}
</script>
</body>
</html>
